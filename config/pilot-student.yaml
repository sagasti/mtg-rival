# mtg-rival-pilot — partidas 1v1 con mazos fijos sobre Forge 2.0.15 limpio (bridge de mtg-bench).
# Uso: bin/bench.sh match config/pilot.yaml --seats glm,forge-ai-2 --decks <abs>/decks/a.dck,<abs>/decks/b.dck --matches N
# Las keys NUNCA van acá: bin/bench.sh exporta MTG_LLM_KEY desde ~/.claude/secrets/op-llm-proxy.env.

event:
  name: pilot-student
  cube: LSVCube   # cubo de Forge; sólo alimenta la base de conocimiento (tools), en match no se draftea
  pods: 1
  seed: 42
  format: round-robin
  rounds: 1
  gamesPerMatch: 1            # bo1: cada "match" es una partida
  packs: 3
  packSize: 15
  minDeckSize: 60
  knowledge: oracle           # texto oracle inline de cada carta que aparece en la decisión; sin tools por ahora
  damageMath: true          # parche piloto: sección "Damage math" (daño disponible, letal, combate entrante) calculada por el harness
  mulliganMath: true        # parche piloto (15/10): sección "Keep or mulligan" (tierras, fuentes, odds de land drops, veredicto heurístico)
  mulliganPolicy: strict     # parche piloto (16/10): los casos claros (0 tierras, una tierra sin plan, 5+ tierras en 7) los contesta el harness; el modelo se quedaba one-landers contra el veredicto
  plansFile: /Users/jorge/dev/mtg-rival-pilot/knowledge/plans.yaml   # parche piloto (15/10): sección "Game plan" por cruce, rival inferido de lo visible
  playDrawAlternate: false  # true = el match impar sale el seat 0 y el par el seat 1 (vara balanceada); bin/bench.sh --alternate lo prende
  cubeStudy: false
  briefMaxWords: 600
  briefScope: all
  carryNotes: true
  recordPrompts: true         # guarda cada prompt renderizado en runs/<id>/rendered-prompts.jsonl para revisar qué ve el modelo
  promptVersion: v2
  maxToolCallsPerDecision: 4
  maxRetries: 3
  decisionTimeoutSec: 240
  maxGameTurns: 40
  parallelMatches: 2
  priorityStops: smart
  manaPayment: smart

engine:
  type: forge
  forgeDir: /Users/jorge/dev/mtg-rival-pilot/forge
  bridgeJar: /Users/jorge/dev/mtg-rival-pilot/vendor/mtg-bench/bridge/build/mtg-bench-bridge-v2.jar   # bridge con --first (salir/robar forzado); el jar sin sufijo es el original
  controller: human           # el path validado por mtg-bench: controlador humano de Forge manejado headless
  java: /Users/jorge/Library/Java/JavaVirtualMachines/openjdk-19.0.2/Contents/Home/bin/java   # arm64 nativo (el JDK 24 de la Mac es x86 bajo Rosetta)
  javaOpts: ["-Xmx3g"]
  gameTimeoutSec: 3600

outputDir: /Users/jorge/dev/mtg-rival-pilot/runs

pricing: {}

seats:
  - { id: forge-ai-1, provider: forge-ai }        # IA de stock de Forge (la misma vara que usa Grok)
  - { id: forge-ai-2, provider: forge-ai }
  - { id: rank-1, provider: rank-bot }            # bot greedy que juega A TRAVÉS del bridge: prueba todas las decisiones gratis
  # ⚠️ el harness exige EXACTAMENTE 8 seats (pods × 8, herencia del draft): para sumar uno hay que sacar otro
  - id: glm
    provider: openai
    model: glm-5.3
    baseUrl: ${MTG_LLM_BASE_URL}   # endpoint OpenAI-compatible; viene del entorno (bin/bench.sh lo exporta), nunca del repo
    apiKeyEnv: MTG_LLM_KEY
    label: "GLM 5.3 (proxy LLM)"
    maxTokens: 8192
    reasoningEffort: low      # sin esto razona >4096 tokens por decisión (74-146 s); con low: ~100 tokens, 5 s. El proxy sólo acepta low|high|max
  - id: student                # el modelo fine-tuneado (Qwen3 + LoRA) servido por vLLM en el pod de RunPod (runpod/serve-student.sh)
    provider: openai
    model: ${STUDENT_MODEL}
    baseUrl: ${STUDENT_BASE_URL}
    apiKeyEnv: STUDENT_KEY     # vLLM no valida la key; cualquier valor
    label: "Student (Qwen3 LoRA, RunPod)"
    maxTokens: 2048
    temperature: 0.2
    extraBody: { chat_template_kwargs: { enable_thinking: false } }   # Qwen3 sin razonamiento: rápido; probar con true cuando el SFT lo justifique
  - id: flash
    provider: openai
    model: deepseek-v4.1-flash
    baseUrl: ${MTG_LLM_BASE_URL}   # endpoint OpenAI-compatible; viene del entorno (bin/bench.sh lo exporta), nunca del repo
    apiKeyEnv: MTG_LLM_KEY
    label: "DeepSeek V4.1 Flash (proxy LLM)"
    maxTokens: 8192           # razonamiento silencioso siempre activo (400-2700 tokens por decisión); el proxy exige >= 1024
    temperature: 0.3          # ⚠️ sin reasoningEffort explota en decisiones de daño (Red Madness): 17-20k tokens, 200-240 s, timeouts (flash-red-x4: 4 forfeits)
    fallbackReasoningEffort: none   # parche pilot (vendor/mtg-bench rama `pilot`): si se acaba el budget, re-pregunta UNA vez sin razonamiento en vez de pasar
    fallbackTimeoutSec: 60
  - id: glm-b                # mismo piloto que glm, para partidas piloto vs piloto (el harness no acepta el mismo seat dos veces)
    provider: openai
    model: glm-5.3
    baseUrl: ${MTG_LLM_BASE_URL}   # endpoint OpenAI-compatible; viene del entorno (bin/bench.sh lo exporta), nunca del repo
    apiKeyEnv: MTG_LLM_KEY
    label: "GLM 5.3 B (proxy LLM)"
    maxTokens: 8192
    reasoningEffort: low
  - id: flash-none
    provider: openai
    model: deepseek-v4.1-flash
    baseUrl: ${MTG_LLM_BASE_URL}   # endpoint OpenAI-compatible; viene del entorno (bin/bench.sh lo exporta), nunca del repo
    apiKeyEnv: MTG_LLM_KEY
    label: "DeepSeek V4.1 Flash sin razonamiento (proxy LLM)"
    maxTokens: 8192
    temperature: 0.3
    reasoningEffort: none     # 0 tokens de razonamiento, 41 de salida en el probe; respuesta correcta pero línea de juego equivocada
